name: Set up Linux sandbox runtime
description: Install bubblewrap and permit nested unprivileged user namespaces
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y bubblewrap
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        # Ubuntu 25.04+ confines bwrap children as unpriv_bwrap, which denies a nested userns.
        if [ -f /etc/apparmor.d/bwrap-userns-restrict ]; then
          sudo mkdir -p /etc/apparmor.d/disable
          sudo ln -sf /etc/apparmor.d/bwrap-userns-restrict /etc/apparmor.d/disable/
          sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict
        fi
