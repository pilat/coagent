name: Nightly Mutation

# Diagnostic only: intentionally no pull_request or push trigger, and no job in
# this workflow is a merge or branch-protection gate.
on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:
    inputs:
      shard:
        description: "Optional: run a single shard (e.g. models) instead of all"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: nightly-mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.pick.outputs.shards }}
    steps:
      - name: Pick shards
        id: pick
        env:
          SHARD: ${{ inputs.shard }}
        run: |
          if [ -n "$SHARD" ]; then
            echo "shards=[\"$SHARD\"]" >> "$GITHUB_OUTPUT"
          else
            echo 'shards=["commands","runtime","persistence","async","managers","models","tooling","config","support","daemon-lifecycle","daemon-subagents","daemon-ops","daemon-output"]' >> "$GITHUB_OUTPUT"
          fi

  mutation:
    name: Mutation (${{ matrix.shard }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: true
          cache: true
      - name: Bootstrap pinned tools
        run: make tools
      - name: Run diagnostic mutation shard
        env:
          NIGHTLY_MUTATION_SHARD: ${{ matrix.shard }}
        run: make mutation.nightly
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-${{ matrix.shard }}-${{ github.run_id }}
          path: mutation-reports/${{ matrix.shard }}/
          if-no-files-found: warn
          retention-days: 14
