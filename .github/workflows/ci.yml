name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (ubuntu-latest)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install: true
          cache: true
      - name: Install Linux sandbox runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # Ubuntu 25.04+ confines bwrap children as unpriv_bwrap, which denies a nested userns.
          if [ -f /etc/apparmor.d/bwrap-userns-restrict ]; then
            sudo mkdir -p /etc/apparmor.d/disable
            sudo ln -sf /etc/apparmor.d/bwrap-userns-restrict /etc/apparmor.d/disable/
            sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict
          fi
      - name: Bootstrap pinned tools
        run: make tools
      - name: Validate workflows
        run: make workflow.check
      - name: Run CI
        run: make ci
      - name: Run compiled harness smoke
        run: make harness-e2e CI_E2E_COUNT=1

  deep:
    name: Scheduled CI
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install: true
          cache: true
      - name: Install Linux sandbox runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # Ubuntu 25.04+ confines bwrap children as unpriv_bwrap, which denies a nested userns.
          if [ -f /etc/apparmor.d/bwrap-userns-restrict ]; then
            sudo mkdir -p /etc/apparmor.d/disable
            sudo ln -sf /etc/apparmor.d/bwrap-userns-restrict /etc/apparmor.d/disable/
            sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict
          fi
      - name: Bootstrap pinned tools
        run: make tools
      - name: Run deep CI
        run: make ci harness-e2e long-fuzz race stress
