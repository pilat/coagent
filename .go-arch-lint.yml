version: 3
workdir: .

allow:
  # We model internal architecture here, not vendor policy.
  depOnAnyVendor: true
  # A stale/misspelled component must fail the gate instead of silently dropping
  # its rules after a directory move.
  ignoreNotFoundComponents: false
  # deepScan resolves concrete types through interface params at call sites, so
  # it catches coupling the import graph hides. Keep it on: it guards the rule
  # that tool (protocol) stays a pure leaf while builtin (implementations) carries
  # the capability-hub dependencies.
  deepScan: true

# tmp/ holds an unrelated vendored project (openclaw) with its own go.mod.
exclude:
  - tmp
  - ai

# Arch rules govern production dependency direction. Test wiring (e.g. tests
# pulling migrate to build a temp DB) is not an architectural edge.
excludeFiles:
  - "_test\\.go$"

components:
  main:           { in: cmd/coagent }

  admission:      { in: internal/admission }
  coagenthome:    { in: internal/coagenthome }
  config:         { in: internal/config }
  configapply:    { in: internal/configapply }
  logger:         { in: internal/logger }
  llmwire:        { in: internal/llmwire }
  humanize:       { in: internal/humanize }
  safefile:       { in: internal/safefile }
  sessionevent:   { in: internal/sessionevent }
  sessionbus:     { in: internal/sessionbus }
  controllerapi:  { in: internal/controllerapi }
  id:             { in: internal/id }
  git:            { in: internal/git }
  version:        { in: internal/version }
  install:        { in: internal/install }
  migrate:        { in: internal/migrate }
  migrations:     { in: migrations }
  releasebuilder: { in: cmd/releasebuilder }
  registry:     { in: internal/registry }
  todo:         { in: internal/todo }
  lsp:          { in: internal/lsp }
  loader:       { in: internal/loader }
  memory:       { in: internal/memory }
  mcpstore:     { in: internal/mcpstore }
  sessionstore: { in: internal/sessionstore }
  subagent:     { in: internal/subagent }
  transcript:   { in: internal/transcript }
  managerdelivery: { in: internal/managerdelivery }
  managercontrol: { in: internal/managercontrol }
  managerdiscovery: { in: internal/managerdiscovery }
  progress:      { in: internal/progress }
  projectpath:   { in: internal/projectpath }
  progressruntime: { in: internal/progressruntime }
  budget:        { in: internal/budget }

  tool:       { in: internal/tool }
  bashsandbox: { in: internal/bashsandbox }
  sandboxpolicy: { in: internal/sandboxpolicy }
  procexec:   { in: internal/procexec }
  backgroundprocess: { in: internal/backgroundprocess }
  builtin:    { in: internal/tool/builtin }
  catalog:    { in: internal/catalog }
  llm:        { in: internal/llm }
  mcp:        { in: internal/mcp }
  shellenv:   { in: internal/shellenv }

  session:    { in: internal/session }
  sessionbuild: { in: internal/sessionbuild }
  sessionprompt: { in: internal/sessionprompt }
  schedule:   { in: internal/schedule }

  telegram:   { in: internal/managers/telegram }

  managers:   { in: internal/managers }
  daemon:     { in: internal/daemon }

  configops:  { in: internal/configops }
  ctl:        { in: internal/ctl }

deps:
  # Composition root — wires everything.
  main:
    anyProjectDeps: true

  # Leaves stay leaves unless an edge is explicitly admitted here. There are no
  # global "common" exceptions: even logging/config/protocol imports are part of
  # a component's contract and a new one must be reviewed.
  config:
    mayDependOn: [coagenthome, sandboxpolicy]
  controllerapi:
    mayDependOn: [sessionevent]
  install:
    mayDependOn: [coagenthome]
  migrate:
    mayDependOn: [coagenthome, logger, migrations]
  todo:
    mayDependOn: [id]
  budget:
    mayDependOn: [tool]
  sessionstore:
    mayDependOn: [budget, controllerapi, progress, todo, transcript]
  subagent:
    mayDependOn: [loader, registry, sessionstore, tool, transcript]
  mcpstore:
    mayDependOn: [coagenthome, tool]
  sessionbus:
    mayDependOn: [controllerapi, logger, sessionevent]
  progressruntime:
    mayDependOn: [budget, controllerapi, logger, progress, sessionbus, sessionevent, sessionstore, todo]
  projectpath:
    mayDependOn: [coagenthome, config, controllerapi]
  safefile:
    mayDependOn: [coagenthome, sandboxpolicy]
  managercontrol:
    mayDependOn: [config, controllerapi, daemon, git, loader, managerdiscovery, projectpath, sessionbus, sessionevent, sessionstore]
  managerdiscovery:
    mayDependOn: [coagenthome, config, controllerapi, loader, projectpath, sessionstore]

  # Per-cwd shell activation, consumed by the three per-cwd spawners.
  bashsandbox:
    mayDependOn: [coagenthome, procexec, sandboxpolicy, shellenv]
  # Pure permission compilation: grants, the protected list, the digest. No
  # process lifetime, no runner.
  sandboxpolicy:
    mayDependOn: [coagenthome]
  git:
    mayDependOn: [procexec]
  lsp:
    mayDependOn: [coagenthome, logger, procexec, safefile, shellenv]
  loader:
    mayDependOn: [coagenthome, config, git, logger, safefile]
  mcp:
    mayDependOn: [logger, procexec, shellenv, tool]
  procexec:
    anyProjectDeps: false
    anyVendorDeps: true
  backgroundprocess:
    mayDependOn: [logger, procexec, sessionstore]
  shellenv:
    mayDependOn: [coagenthome, logger, procexec]

  # Shared protocols are small, but not globally importable by fiat.
  tool:
    mayDependOn: [llmwire]

  # External model catalogs — the drivers' source of model metadata.
  catalog:
    mayDependOn: [coagenthome, config, logger]
  llm:
    mayDependOn: [catalog, config, llmwire, logger, safefile]

  progress:
    mayDependOn: [logger]

  # Presentation-only formatting helpers shared across packages; stdlib only.
  humanize:
    anyProjectDeps: false
    anyVendorDeps: true

  # Capability hub: tool implementations reach into a few leaf services.
  builtin:
    mayDependOn: [backgroundprocess, bashsandbox, coagenthome, config, git, humanize, llmwire, loader, logger, lsp, mcp, memory, procexec, projectpath, safefile, sandboxpolicy, shellenv, todo, tool]

  # The loop receives assembled dependencies and only emits live events.
  session:
    mayDependOn: [llm, llmwire, loader, logger, sessionevent, sessionprompt, sessionstore, tool, transcript]
  sessionbuild:
    mayDependOn: [backgroundprocess, builtin, config, git, llm, loader, logger, mcp, mcpstore, memory, registry, session, sessionprompt, sessionstore, todo, tool]
  sessionprompt:
    mayDependOn: [git, llmwire, loader, logger, memory, todo, tool]
  registry:
    mayDependOn: [sessionprompt]

  # Schedule writes inbox rows through sessionstore; its sender publishes only events.
  schedule:
    mayDependOn: [logger, sessionevent, sessionstore, tool]

  # Controllers.
  telegram:
    mayDependOn: [coagenthome, config, controllerapi, humanize, llmwire, logger, managerdelivery, sessionevent]
  managers:
    mayDependOn: [config, controllerapi, logger, telegram]

  # Orchestrator.
  daemon:
    mayDependOn: [admission, backgroundprocess, budget, coagenthome, config, configapply, controllerapi, git, id, llmwire, loader, logger, mcp, mcpstore, progress, progressruntime, projectpath, registry, schedule, session, sessionbuild, sessionprompt, sessionbus, sessionevent, sessionstore, subagent, todo, tool, transcript]

  configops:
    mayDependOn: [coagenthome, config, logger]

  configapply:
    mayDependOn: [coagenthome, config, configops, logger, sessionstore, tool, transcript]

  # Local control plane: pure transport plus the daemon-state ops it answers from.
  ctl:
    mayDependOn: [coagenthome, config, controllerapi, logger, version]
