        type: basic
      - path: ${MISE_CONFIG_DIR}
        mode: ro
        type: basic
      - path: ${MISE_CACHE_DIR}
        mode: rw
        type: basic
      - path: ${MISE_STATE_DIR}
        mode: rw
        type: basic
      - path: ${MISE_DATA_DIR}
        mode: rw
        type: escalated
      - path: ${MISE_INSTALLS_DIR}
        mode: rw
        type: escalated
  git:
