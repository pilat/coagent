version: "2"
profiles:
  shell:
    mounts:
      - path: ~/.bashrc
        mode: ro
        type: basic
        kind: file
      - path: ~/.bash_profile
        mode: ro
        type: basic
        kind: file
      - path: ~/.profile
        mode: ro
        type: basic
        kind: file
      - path: ~/.bash_aliases
        mode: ro
        type: basic
        kind: file
